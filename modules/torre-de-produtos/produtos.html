<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Produtos</title>
<link rel="stylesheet" href="../../assets/css/style.css">
<style>
.prod-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:24px}
.prod-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:var(--sh)}
.prod-card h4{font-size:15px;color:var(--text);margin-bottom:6px}
.prod-card .tag{display:inline-block;font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:20px;margin-bottom:12px}
.tag.po{background:#dcfce7;color:#059669}
.tag.view{background:#e0e7ff;color:#4338ca}
.tag.admin{background:#fef3c7;color:#b45309}
.prod-card .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.prod-card .actions button, .prod-card .actions a{
  font-size:11px;font-weight:700;padding:7px 12px;border-radius:8px;cursor:pointer;
  font-family:inherit;text-decoration:none;display:inline-block;border:1px solid var(--border);
  background:var(--bg3,#f7f9fc);color:var(--navy)
}
.prod-card .actions .primary{background:var(--navy);color:#fff;border-color:transparent}
.prod-card .actions .danger{background:transparent;color:#dc2626;border-color:#fecaca}
.new-prod-btn{background:var(--navy);color:#fff;border:none;padding:10px 16px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:20px}
.pm-overlay{position:fixed;inset:0;background:rgba(15,25,45,.55);z-index:3000;display:flex;align-items:center;justify-content:center}
.pm-modal{background:#fff;border-radius:14px;width:420px;max-width:92vw;max-height:85vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.pm-modal-hdr{background:var(--navy);color:#fff;padding:14px 18px}
.pm-modal-hdr h3{font-size:14px;font-weight:800;margin:0}
.pm-modal-body{padding:18px}
.pm-modal-body label.pm-label{font-size:10.5px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px;margin-top:14px}
.pm-modal-body select{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:12.5px;font-family:inherit}
.pm-checklist{max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.pm-check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);padding:4px 0}
.pm-actions{display:flex;gap:8px;margin-top:18px}
.pm-actions button{flex:1;padding:9px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:1.5px solid var(--border);background:#fff;color:var(--muted)}
.pm-actions button.primary{background:var(--navy);color:#fff;border-color:transparent}
</style>
</head>
<body>

<div class="header-wrap"><div class="header-logo-row">
  <div class="logo">
    <svg class="logo-svg" width="26" height="26" viewBox="0 0 100 100">
      <polygon points="50,8 68,22 68,38 50,30" fill="#1a3a5c"/>
      <polygon points="50,8 32,22 32,38 50,30" fill="#1a3a5c"/>
      <polygon points="50,32 76,48 76,62 50,54" fill="#dc2626"/>
      <polygon points="50,32 24,48 24,62 50,54" fill="#dc2626"/>
      <polygon points="50,56 84,74 84,94 50,84" fill="#1a3a5c"/>
      <polygon points="50,56 16,74 16,94 50,84" fill="#1a3a5c"/>
    </svg>
    <div class="logo-tx"><b>Torre de Produtos</b><span>Portfólio 2026</span></div>
  </div>
</div></div>
<div class="topbar">
  <div class="user">
    <div class="avatar" id="topbarAvatar">--</div>
    <span id="topbarName">Carregando...</span>
    <span class="logout-btn" onclick="handleLogout()">Sair</span>
  </div>
</div>

<div class="home-wrap">
  <span class="backlink" onclick="window.location.href='home.html'">← Voltar</span>
  <h2 id="pageTitle">Produtos</h2>
  <p id="pageSub">Carregando seus produtos...</p>

  <button class="new-prod-btn hide" id="btnNovoProduto" onclick="criarProduto()">+ Novo produto</button>
  <div class="prod-list" id="prodList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../assets/js/supabaseClient.js"></script>
<script src="../../assets/js/auth.js"></script>
<script>
var IS_ADMIN = false;      // pode gerenciar produtos/acessos (admin OU manager)
var USER_ROLE = '';        // role real do usuário logado (admin/manager/po/stakeholder)
var CURRENT_USER = null;
var USERS_CACHE = null;

function escapeHtml(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// Monta um literal de string JS entre aspas simples, escapando o que precisar.
function jsStr(s){
  return "'" + String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'") + "'";
}

async function getUsersMap(){
  if(USERS_CACHE) return USERS_CACHE;
  var { data, error } = await supabaseClient.rpc('list_users');
  USERS_CACHE = {};
  if(!error && data) data.forEach(function(u){ USERS_CACHE[u.id] = u.email; });
  return USERS_CACHE;
}

function slugify(nome){
  return nome.toString().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'produto';
}

async function carregarProdutos(){
  var { data: produtos, error } = await supabaseClient.from('products').select('*').order('created_at');
  if(error){
    document.getElementById('pageSub').textContent = 'Erro ao carregar produtos: '+error.message;
    return;
  }
  produtos = produtos || [];

  document.getElementById('btnNovoProduto').classList.toggle('hide', !IS_ADMIN);

  if(IS_ADMIN){
    document.getElementById('pageTitle').textContent = 'Produtos (administração)';
    document.getElementById('pageSub').textContent = produtos.length+' produto(s) cadastrado(s) no portal.';
  } else {
    document.getElementById('pageTitle').textContent = 'Seus produtos';
    document.getElementById('pageSub').textContent = produtos.length
      ? 'Produtos que você tem acesso.'
      : 'Nenhum produto liberado para você ainda — fale com o administrador do portal.';
  }

  // Nível de acesso do usuário logado em cada produto (só importa pra
  // quem não é admin/manager — esses já veem/editam tudo de qualquer jeito).
  var meuAcessoMap = {};
  if(!IS_ADMIN){
    var { data: meuAcesso } = await supabaseClient.from('product_stakeholders').select('product_id,pode_editar').eq('user_id', CURRENT_USER.id);
    (meuAcesso||[]).forEach(function(r){ meuAcessoMap[r.product_id] = r.pode_editar; });
  }

  var html = produtos.map(function(p){
    var souEditor = meuAcessoMap[p.id] === true;
    var tag = IS_ADMIN
      ? '<span class="tag admin">'+(USER_ROLE==='manager'?'Manager':'Admin')+' — vê tudo</span>'
      : (souEditor ? '<span class="tag po">Você pode editar</span>' : '<span class="tag view">Você acompanha (visualização)</span>');
    var manageBtn = IS_ADMIN ? '<button onclick="abrirGerenciarAcesso(\''+p.id+'\')">Gerenciar acesso</button>' : '';
    var delBtn = IS_ADMIN ? '<button class="danger" onclick="'+escapeHtml('excluirProduto('+jsStr(p.id)+','+jsStr(p.name)+')')+'">Excluir</button>' : '';
    return '<div class="prod-card">'+
      tag+
      '<h4>'+escapeHtml(p.name)+'</h4>'+
      (p.bu ? '<div style="font-size:10.5px;color:var(--dim);margin:-4px 0 8px">BU: '+escapeHtml(p.bu)+'</div>' : '')+
      '<div class="actions">'+
        '<a class="primary" href="roadmap.html?product='+p.id+'">Abrir roadmap →</a>'+
        manageBtn+delBtn+
      '</div>'+
    '</div>';
  }).join('');

  document.getElementById('prodList').innerHTML = html || '<div class="placeholder" style="grid-column:1/-1">Nenhum produto por aqui ainda.</div>';
}

async function criarProduto(){
  var nome = prompt('Nome do novo produto:');
  if(!nome || !nome.trim()) return;
  nome = nome.trim();
  var slug = slugify(nome)+'-'+Date.now().toString(36).slice(-4);
  var { data, error } = await supabaseClient.from('products').insert({name:nome, slug:slug, config:{}}).select().single();
  if(error){ alert('Erro ao criar produto: '+error.message); return; }
  await carregarProdutos();
  abrirGerenciarAcesso(data.id);
}

async function excluirProduto(id, nome){
  if(!confirm('Excluir o produto "'+nome+'" definitivamente?\n\nIsso apaga o produto, todos os seus épicos e os acessos configurados. Não pode ser desfeito.')) return;
  var { error } = await supabaseClient.from('products').delete().eq('id', id);
  if(error){ alert('Erro ao excluir: '+error.message); return; }
  await carregarProdutos();
}

async function abrirGerenciarAcesso(productId){
  var { data: produto } = await supabaseClient.from('products').select('*').eq('id', productId).single();
  var usersMap = await getUsersMap();
  var userIds = Object.keys(usersMap);
  var { data: accessRows } = await supabaseClient.from('product_stakeholders').select('user_id,pode_editar').eq('product_id', productId);
  var accessMap = {};
  (accessRows||[]).forEach(function(r){ accessMap[r.user_id] = r.pode_editar ? 'edit' : 'view'; });

  // BUs já usadas em outros produtos — vira sugestão (datalist) no campo
  // abaixo, pra evitar grafias diferentes da mesma BU (ex: "Finance" numa
  // vez e "finance" noutra) quebrarem o agrupamento no Hub. O campo
  // continua sendo texto livre: dá pra digitar uma BU nova também.
  var { data: todosProdutos } = await supabaseClient.from('products').select('bu');
  var busExistentes = Array.from(new Set((todosProdutos||[]).map(function(p){ return (p.bu||'').trim(); }).filter(Boolean))).sort();

  // Cada usuário pode ser associado a mais de um produto, e o nível de
  // acesso (editar ou só visualizar) é definido por produto — não existe
  // mais "o PO" único de um produto: vários usuários (normalmente POs)
  // podem ter edição no mesmo produto ao mesmo tempo.
  var overlay = document.createElement('div');
  overlay.className = 'pm-overlay';
  overlay.innerHTML =
    '<div class="pm-modal">'+
      '<div class="pm-modal-hdr"><h3>Gerenciar acesso — '+escapeHtml(produto.name)+'</h3></div>'+
      '<div class="pm-modal-body">'+
        '<label class="pm-label">BU (unidade de negócio)</label>'+
        '<input type="text" id="pm-bu" list="pm-bu-list" value="'+escapeHtml(produto.bu||'')+'" placeholder="ex: Finance, Cartões, Crédito..." style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:12.5px;font-family:inherit;margin-bottom:4px">'+
        '<datalist id="pm-bu-list">'+busExistentes.map(function(b){ return '<option value="'+escapeHtml(b)+'">'; }).join('')+'</datalist>'+
        '<div style="font-size:9.5px;color:var(--dim);margin-bottom:14px">Produtos com a mesma BU aparecem juntos no Hub, em "Dados por BU". Deixe vazio se este produto não pertence a nenhuma BU ainda.</div>'+
        '<label class="pm-label">Acesso por usuário (PO/stakeholder — editar ou só visualizar)</label>'+
        '<div class="pm-checklist" style="max-height:260px">'+
          (userIds.length ? userIds.map(function(id){
            var nivel = accessMap[id] || '';
            return '<div class="pm-access-row" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0">'+
              '<span style="font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escapeHtml(usersMap[id])+'</span>'+
              '<select class="pm-access-sel" data-uid="'+id+'" style="flex:0 0 auto;width:172px;padding:5px 8px;border:1.5px solid var(--border);border-radius:7px;font-size:11.5px;font-family:inherit">'+
                '<option value="" '+(nivel===''?'selected':'')+'>Sem acesso</option>'+
                '<option value="view" '+(nivel==='view'?'selected':'')+'>Só visualizar</option>'+
                '<option value="edit" '+(nivel==='edit'?'selected':'')+'>Editar e visualizar</option>'+
              '</select>'+
            '</div>';
          }).join('') : '<span style="color:var(--dim);font-size:11.5px">Nenhum usuário cadastrado ainda.</span>')+
        '</div>'+
        '<div class="pm-actions">'+
          '<button id="pm-cancel">Cancelar</button>'+
          '<button class="primary" id="pm-save">Salvar</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#pm-cancel').onclick = function(){ overlay.remove(); };
  overlay.querySelector('#pm-save').onclick = async function(){
    var bu = overlay.querySelector('#pm-bu').value.trim() || null;
    var novosAcessos = Array.prototype.slice.call(overlay.querySelectorAll('.pm-access-sel'))
      .map(function(s){ return { uid: s.getAttribute('data-uid'), nivel: s.value }; })
      .filter(function(a){ return a.nivel; });

    var { error: err1 } = await supabaseClient.from('products').update({bu: bu}).eq('id', productId);
    var { error: err2 } = await supabaseClient.from('product_stakeholders').delete().eq('product_id', productId);
    var err3 = null;
    if(novosAcessos.length){
      var res3 = await supabaseClient.from('product_stakeholders').insert(novosAcessos.map(function(a){
        return { product_id: productId, user_id: a.uid, pode_editar: a.nivel==='edit' };
      }));
      err3 = res3.error;
    }
    if(err1||err2||err3){ alert('Erro ao salvar acesso: '+((err1||err2||err3).message)); return; }
    overlay.remove();
    await carregarProdutos();
  };
}

(async function init(){
  var ctx = await initTopbar('../../index.html');
  if(!ctx) return;
  CURRENT_USER = ctx.user;
  USER_ROLE = (ctx.perfil && ctx.perfil.role) || 'stakeholder';
  IS_ADMIN = USER_ROLE==='admin' || USER_ROLE==='manager';
  await carregarProdutos();
})();
</script>
</body>
</html>
